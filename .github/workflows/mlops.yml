name: MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "app/**"
      - "model/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mlops.yml"

jobs:

  # ============================================================
  # 1. VALIDATE DATA + TEST + TRAIN MODEL
  # ============================================================

  test-and-train:
    name: Validate, Test & Train
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Install Python through uv
      - name: Setup Python
        run: uv python install 3.12

      # Install dependencies from pyproject.toml + uv.lock
      - name: Install Dependencies
        run: uv sync --locked

      # Validate dataset
      - name: Validate Data
        run: uv run python -m src.validate_data

      # Run automated tests
      - name: Run Tests
        run: uv run pytest -q

      # Train model
      # This also performs MLflow tracking
      # and the model quality gate
      - name: Train Model
        run: uv run python -m src.train

      # Upload trained model so the next job can use it
      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model/model.pkl

      # Upload MLflow SQLite database
      - name: Upload MLflow Database
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-database
          path: mlflow.db


  # ============================================================
  # 2. BUILD DOCKER IMAGE + PUSH TO DOCKER HUB
  # ============================================================

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs: test-and-train

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Download model generated by training job
      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-price:latest .

      # Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-price:latest


  # ============================================================
  # 3. DEPLOY TO AMAZON LINUX EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy to Amazon Linux EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Pulling latest Docker image"
            echo "================================="

            sudo docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-price:latest

            echo "================================="
            echo "Stopping old container"
            echo "================================="

            sudo docker stop mlops-house-price || true

            echo "================================="
            echo "Removing old container"
            echo "================================="

            sudo docker rm mlops-house-price || true

            echo "================================="
            echo "Starting new container"
            echo "================================="

            sudo docker run -d \
              --name mlops-house-price \
              -p 80:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/mlops-house-price:latest

            echo "================================="
            echo "Running containers"
            echo "================================="

            sudo docker ps

            echo "================================="
            echo "Container logs"
            echo "================================="

            sudo docker logs --tail 20 mlops-house-price

            echo "================================="
            echo "Deployment completed"
            echo "================================="